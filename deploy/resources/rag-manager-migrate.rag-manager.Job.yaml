apiVersion: batch/v1
kind: Job
metadata:
  name: rag-manager-migrate
  namespace: rag-manager-system
  labels:
    app.kubernetes.io/name: rag-manager-system
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-manager-system
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: rag-manager-image
          imagePullPolicy: IfNotPresent
          command:
            - /app/migrate
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: rag-manager-postgres
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: rag-manager-postgres
                  key: port
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: rag-manager-postgres
                  key: database
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rag-manager-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-manager-postgres
                  key: password
            - name: GOBOX_GOOSE_TABLE_NAME
              value: goose_db_version_outbox
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
